name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SivaTeja36
          # First colour in color_dots is the EMPTY cell.
          # Light: GitHub's light grid grey, then a purple ramp.
          # Dark : a visible slate (#2d3343) — a near-black empty cell vanishes on #0d1117.
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#EBEDF0,#DDD6FE,#C4B5FD,#A78BFA,#7C3AED
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#2d3343,#4C3A8A,#6D5BB5,#8B7BD6,#A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
